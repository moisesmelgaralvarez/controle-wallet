<!DOCTYPE html>
<html lang="es-HN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Wallet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/sitio.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>

<div class="app">

  <!-- El MISMO juego de destinos en los dos sitios: riel en pantalla
       grande, barra de pestañas en teléfono. Un solo lugar donde
       cambiar cuando se agregue una vista. -->
  <aside class="riel-app app__riel">
    <a class="riel-app__marca" href="/app/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M9.3 19V5M14.7 19v-6M20 19v-9"/></svg>
      <span>Controle Wallet</span>
    </a>
    <a class="nav" href="/app/" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M9.3 19V5M14.7 19v-6M20 19v-9"/></svg>
      Resumen
    </a>
    <div class="riel-app__pie">
      <span class="estado" id="estado" data-estado="cargando">
        <span class="estado__punto" aria-hidden="true"></span>
        <span id="estadoTexto">Cargando…</span>
      </span>
      <button class="boton boton--borde" type="button" id="salir">Cerrar sesión</button>
    </div>
  </aside>

  <div>
    <p class="solo-lectura" id="soloLectura" hidden>
      Sin conexión. Podés ver lo último cargado, pero no registrar nada — los
      datos viven en el servidor.
    </p>

    <header class="tope">
      <h1 id="titulo">Resumen</h1>
      <span class="tope__mes" id="mes"></span>
      <div class="tope__der">
        <span class="estado" id="estado2" data-estado="cargando">
          <span class="estado__punto" aria-hidden="true"></span>
          <span id="estadoTexto2">Cargando…</span>
        </span>
      </div>
    </header>

    <main class="contenido" id="vista">
      <div class="cargando" id="cargando">
        <p>Trayendo tu hogar del servidor…</p>
      </div>
    </main>
  </div>

  <nav class="barra-app app__barra" aria-label="Secciones">
    <a href="/app/" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M9.3 19V5M14.7 19v-6M20 19v-9"/></svg>
      Resumen
    </a>
  </nav>

</div>

<script type="module" src="/app/app.js"></script>
</body>
</html>
